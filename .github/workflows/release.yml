name: release

# Managed by maelys-release v0.62.3 (0.62.3). Regenerate with
# 'maelys-release adopt' of maelys-release; do not edit by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed tag whose release and Homebrew publication are replayed
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    uses: maelys-dev/maelys-release/.github/workflows/release.yml@642f235775b7b15b52126908ac54542e280d5a47 # v0.62.3
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      product: agent-cli-spec
      tag: ${{ inputs.tag || github.ref_name }}
      linux_packages: build-essential dpkg-dev file rpm zsh fish
